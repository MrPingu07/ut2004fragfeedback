name: Release

on:
  release:
    types: [published]

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "FragFeedback-${VERSION}.zip" \
            README.md \
            install \
            source \
            tools \
            docs \
            -x '*.u' '*.ucl' '.git/*'

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "FragFeedback-*.zip"
